name: ci

# 가상자료만 사용한다. 실제 정본·사진·API 키를 runner에 올리지 않는다 (릴리스 계획 §11).
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -W error::UserWarning

  web:
    # 웹 모듈 단위 테스트. 앱 실행에는 Node가 필요 없고, 테스트 실행에만 쓴다 (npm 의존성 없음).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      # e2e 는 runner 의 Chrome(google-chrome) 을 CDP 로 구동하고, 저장된 관측을 j5 inspect 로 검사한다
      - run: node --test "tests/web/**/*.test.mjs"
