<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>종로5가 투자지도</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<h1>종로5가 투자지도</h1>
<p class="muted">R1a 현장 기록. 정적 앱, 외부 통신 없음. <span id="status-line"></span></p>
<p id="fatal" class="bad" hidden></p>

<section id="sec-settings">
  <h2>설정</h2>
  <label>study_id <input id="study-id" type="text" autocomplete="off" placeholder="예: j5-synthetic-study"></label>
  <label>자료 모드
    <select id="data-mode"><option value="synthetic">synthetic (가상)</option><option value="private_real">private_real (실제·비공개)</option></select>
  </label>
  <label>경로 버전 ID (선택, UUID) <input id="route-version" type="text" autocomplete="off" placeholder="비우면 자유 임장"></label>
  <button id="save-settings">설정 저장</button> <span id="settings-note" class="muted"></span>
</section>

<section id="sec-seed">
  <h2>물건 목록 (assets.seed.json)</h2>
  <p class="muted">시드를 바꿔도 저장된 관측은 지우지 않는다. 실제 시드 파일은 기기에서만 읽고 어디에도 보내지 않는다.</p>
  <button id="load-synthetic">가상 시드 불러오기 (5개)</button>
  <label>시드 파일 불러오기 <input id="seed-file" type="file" accept="application/json,.json"></label>
  <p id="seed-note" class="muted"></p>
  <ul id="asset-list" class="plain"></ul>
</section>

<section id="sec-observe" hidden>
  <h2>관측 기록: <span id="target-label"></span></h2>
  <label>관측 상태
    <select id="change-status">
      <option value="">선택</option>
      <option value="change_observed">변화 확인 (사진 또는 설명 필요)</option>
      <option value="no_change">변화 없음</option>
      <option value="hard_to_confirm">확인 어려움</option>
    </select>
  </label>
  <label>관측 시각 <input id="observed-at" type="datetime-local"></label>
  <label><input id="date-only" type="checkbox"> 날짜만 기록 (시각을 모를 때)</label>
  <label>설명 (선택, 2000자) <textarea id="note" rows="3" maxlength="2000"></textarea></label>
  <label>사진 (JPEG/PNG/WebP, 20MB 이하) <input id="photos" type="file" accept="image/*" multiple></label>
  <div id="photo-list"></div>
  <button id="save-observation">저장</button>
  <button id="cancel-observation">취소</button>
  <p id="observe-note"></p>
</section>

<section id="sec-records">
  <h2>저장된 관측 <span id="record-count" class="muted"></span></h2>
  <p class="muted">상태: 저장됨 → 내보냄(J5-007). PC 반영 여부는 이 화면에서 알 수 없다(PC 반영 여부 미확인).</p>
  <ul id="record-list" class="plain"></ul>
</section>

<p class="muted"><a href="devtest.html">기기 시험 페이지</a></p>
<script type="module" src="app/main.js"></script>
</body>
</html>
